; Ajustes do Map-OS sobre o php.ini-production.

; A configuração vem das variáveis do container (.env): sem o "E" o $_ENV
; fica vazio e o Map-OS abre o instalador.
variables_order = "EGPCS"

expose_php = Off
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 20M
post_max_size = 25M
date.timezone = America/Sao_Paulo

session.cookie_httponly = 1

; O código é atualizado com git pull: o opcache confere os arquivos a cada 60 s.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
