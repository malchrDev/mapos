# nginx interno do Map-OS: recebe do Traefik (HTTP na rede saas_edge) e passa
# o PHP para o FPM. Qualquer hostname chega aqui; quem decide a empresa é o
# hook application/hooks/tenant.php (Host desconhecido recebe 404 de lá).

# O Traefik termina o HTTPS: o PHP precisa saber, senão os links e o cookie
# Secure saem como http.
map $http_x_forwarded_proto $mapos_https {
    https on;
    default "";
}

server {
    listen 80 default_server;
    server_name _;

    # IP real do visitante (Limite_login e auditoria). Só o Traefik fala com
    # este nginx (rede interna do Docker), então o cabeçalho é confiável.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /app;
    index index.php;
    client_max_body_size 25M;
    server_tokens off;

    # arquivos ocultos (.env, .git...)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # instalador e código do servidor
    location ^~ /install/ {
        deny all;
    }
    location ~* ^/(application|docker|tests|scripts|updates|node_modules|phpstan-stubs)/ {
        deny all;
    }

    # arquivos da raiz que não são do site (banco.sql, composer.json, *.md...)
    location ~* ^/(?!assets/)[^/]*\.(sql|md|json|lock|xml|dist|neon|sh|ya?ml|txt|log|ini|php-cs-fixer\.php)$ {
        deny all;
    }

    # pastas de upload: nunca executar script
    location ~* ^/assets/(anexos|arquivos|uploads|userImage)/.*\.(php[0-9]*|phtml|phar|pht|phps|cgi|pl|py|sh)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php;
    }

    location ~ \.php$ {
        # só o index.php roda; qualquer outro .php é 404
        location ~ ^/(?!index\.php$) {
            return 404;
        }
        try_files $uri =404;
        fastcgi_pass web:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $mapos_https;
        fastcgi_read_timeout 300;
    }
}
