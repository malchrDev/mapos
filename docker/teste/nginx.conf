# Qualquer hostname chega ao Map-OS: quem decide o tenant é o hook
# application/hooks/tenant.php (Host desconhecido recebe 404 de lá).
server {
    listen 80 default_server;
    server_name _;

    root /app;
    index index.php;
    client_max_body_size 64M;

    # . files
    location ~ /\.(?!well-known) {
        deny all;
    }

    # upload folders: never execute scripts
    location ~* ^/assets/(anexos|arquivos)/.*\.(php[0-9]*|phtml|phar|pht|phps)$ {
        deny all;
    }

    # instalador e código do servidor não são públicos neste ambiente
    location ^~ /install/ {
        deny all;
    }

    location ~* ^/(application|docker|tests|scripts|updates)/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass web:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
    }
}
